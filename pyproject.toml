[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolf-eda"
dynamic = ["version"]
description = "EDA workflow and environment manager"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Manuel Blanco Valentin"},
]
dependencies = [
  "PyYAML>=6.0",
  "rich>=13.0",
  "textual>=0.60",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
wolf = "wolf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "wolf.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/wolf/bin" = [
  "bin/backend.sh",
  "bin/container_executor.sh",
  "bin/yaml_helper.py",
  "bin/utils",
  "bin/wolf.env",
  "bin/wolf.run",
]
"share/wolf/bin/backends" = [
  "bin/backends/cadence-flowtool.sh",
  "bin/backends/orfs.sh",
]
"share/wolf/templates" = [
  "templates/activate.template",
  "templates/deactivate.template",
]
"share/wolf/flows/cadence-genus" = [
  "flows/cadence-genus/presentation.tcl",
  "flows/cadence-genus/common_flows.tcl",
  "flows/cadence-genus/common_steps.tcl",
  "flows/cadence-genus/synthesis.tcl",
  "flows/cadence-genus/floorplanning.tcl",
  "flows/cadence-genus/cts.tcl",
  "flows/cadence-genus/route.tcl",
  "flows/cadence-genus/postroute.tcl",
  "flows/cadence-genus/flow.template.yaml",
  "flows/cadence-genus/setup.template.yaml",
  "flows/cadence-genus/create_fplan.template.tcl",
]
"share/wolf/shell" = ["shell/wolf.bash", "shell/wolf.zsh"]
"share/wolf/registry/rtl" = ["registry/rtl/ibex.yaml", "registry/rtl/aes.yaml", "registry/rtl/ibex-fabulous-mvp.yaml"]
"share/wolf/registry/pdk" = ["registry/pdk/asap7.yaml"]
"share/wolf/registry/flow" = ["registry/flow/orfs.yaml"]
"share/wolf/skills/run-flow" = [
  "skills/run-flow/SKILL.md", "skills/run-flow/smoke.sh", "skills/run-flow/golden.jsonl",
]
"share/wolf/skills/environments" = [
  "skills/environments/SKILL.md", "skills/environments/smoke.sh", "skills/environments/golden.jsonl",
]
"share/wolf/skills/new-environment" = [
  "skills/new-environment/SKILL.md", "skills/new-environment/smoke.sh", "skills/new-environment/golden.jsonl",
]
"share/wolf/skills/run-failures" = [
  "skills/run-failures/SKILL.md", "skills/run-failures/smoke.sh", "skills/run-failures/golden.jsonl",
]
"share/wolf/skills/preflight" = [
  "skills/preflight/SKILL.md", "skills/preflight/smoke.sh", "skills/preflight/golden.jsonl",
]
"share/wolf/skills/monitoring" = [
  "skills/monitoring/SKILL.md", "skills/monitoring/smoke.sh", "skills/monitoring/golden.jsonl",
]
