%TAG ! tag:flow.stylus.cadence.com,0.1:
---
# WOLF's default Cadence Flowtool project descriptor -- the generic,
# technology-independent half of what Flowtool needs to run WOLF's bundled
# Genus/Innovus flow (common_flows.tcl and friends in this same directory).
# The real flow sequencing lives in Tcl's own create_flow/create_flow_step
# calls, not in a yaml step tree, so this file only tells Flowtool which
# scripts define this run's steps and which resolved-value script to load.
#
# design_yaml (below) is the attribute that actually tells Flowtool's
# get_flow_config which yaml file to read -- confirmed against a real
# institution Flowtool project descriptor, where the equivalent attribute
# (also named design_yaml there) points at that institution's own
# per-run design-data yaml. Without it, get_flow_config has no file bound
# at all and every lookup fails silently (a -quiet one returns "", a
# required one errors) regardless of anything else being correct --
# confirmed real: WOLF's own bundled flow migrated every step body to
# get_flow_config before this line existed, and every lookup failed.
#
# A project with its own extension Tcl, or Cadence's other yaml-step-tree
# features, can still override this file entirely via
# backend.cadence-flowtool.flowtool.flow_template (paired with its own
# setup_template) -- that escape hatch is unchanged.
#
# include_procs/default_flow_steps/user_flow_steps are written as absolute
# paths rather than bare filenames resolved against init_flow_directory:
# confirmed against a real flowtool run that these resolve relative to
# this yaml file's OWN directory, not init_flow_directory (which is a
# generic Flowtool attribute a flow's own Tcl can read back via
# get_flow_config, not something Flowtool applies to this yaml's own file
# lists) -- and this file lives alongside the per-run generated values in
# backend/cadence-genus, one level above the real scripts in their own
# deduplicated scripts.<N> snapshot.

remarks: WOLF generic Cadence Genus/Innovus flow descriptor

# The real setup.<design_name>.yaml get_flow_config reads from --
# WOLF_SETUP_YAML is "" (an intentionally empty, harmless attribute) for
# the rare flow package that ships no setup.template.yaml of its own and
# has no override either (see _flowtool_templates's own docstring in
# wolf/backend/cadence_genus.py).
design_yaml: ${WOLF_SETUP_YAML}

init_flow_directory: ${WOLF_SCRIPTS_DIR}

include_procs:
  - ${WOLF_SCRIPTS_DIR}/presentation.tcl

default_flow_steps:
  - ${WOLF_SCRIPTS_DIR}/common_flows.tcl
  - ${WOLF_SCRIPTS_DIR}/common_steps.tcl
  - ${WOLF_SCRIPTS_DIR}/synthesis.tcl
  - ${WOLF_SCRIPTS_DIR}/floorplanning.tcl
  - ${WOLF_SCRIPTS_DIR}/cts.tcl
  - ${WOLF_SCRIPTS_DIR}/route.tcl
  - ${WOLF_SCRIPTS_DIR}/postroute.tcl

user_flow_steps:
  - ${WOLF_FLOW_CONFIG_SCRIPT}

flow_current: block
